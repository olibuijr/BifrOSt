<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">BifrOSt — Brú elds og íss</title>
  <desc id="desc">An original Icelandic night landscape with a luminous Bifröst bridge, glaciers, basalt mountains, and a historically grounded longship silhouette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030812"/>
      <stop offset="0.5" stop-color="#0a1b31"/>
      <stop offset="1" stop-color="#16364b"/>
    </linearGradient>
    <radialGradient id="horizon" cx="55%" cy="56%" r="55%">
      <stop offset="0" stop-color="#3d7f91" stop-opacity=".55"/>
      <stop offset="0.48" stop-color="#173a50" stop-opacity=".22"/>
      <stop offset="1" stop-color="#030812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35f2c1" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#35f2c1" stop-opacity=".78"/>
      <stop offset="0.52" stop-color="#7ad7ff" stop-opacity=".62"/>
      <stop offset="0.78" stop-color="#9b7cff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#f4b85e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b85e" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#f4b85e" stop-opacity=".58"/>
      <stop offset="0.6" stop-color="#ec6e8d" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9b7cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f8ff"/>
      <stop offset="0.48" stop-color="#7eb5c9"/>
      <stop offset="1" stop-color="#29495d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183e51"/>
      <stop offset="0.22" stop-color="#0a2435"/>
      <stop offset="1" stop-color="#030914"/>
    </linearGradient>
    <filter id="auroraGlow" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="34" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="19" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
    <clipPath id="markClip"><rect x="0" y="0" width="290" height="290" rx="50"/></clipPath>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#horizon)"/>

