  <path d="M162 1410 505 1310 848 1010 1040 1140 1322 862 1510 1064 1820 795 2115 1116 2395 934 2730 1188 2990 1000 3340 1238 3618 1114 3840 1260v172l-3840 22Z" fill="url(#ice)" opacity=".88"/>
