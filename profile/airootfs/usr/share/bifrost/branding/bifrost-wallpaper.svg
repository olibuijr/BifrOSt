    <path d="M19 83C32 43 59 23 99 23c9 0 17 1 25 4" fill="none" stroke="#7ad7ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M48 111V44h25c25 0 35 28 15 39L73 91H48m25-47L48 75m25 16 25 20" fill="none" stroke="#eefaff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="176" y="78" fill="#f3fbff" font-family="Noto Sans, sans-serif" font-size="86" font-weight="700" letter-spacing="2">Bifr<tspan fill="#f4b85e">OS</tspan>t</text>
    <text x="179" y="120" fill="#9dc4d3" font-family="Noto Sans, sans-serif" font-size="23" font-weight="600" letter-spacing="7">ÍSLENSKT · FRJÁLST · BYGGT Á ARCH LINUX</text>
