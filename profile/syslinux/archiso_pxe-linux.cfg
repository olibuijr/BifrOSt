LABEL arch_nbd
TEXT HELP
Boot the BifrOSt live/install medium using NBD.
Based on Arch Linux for installation and system maintenance.
ENDTEXT
MENU LABEL BifrOSt live/install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

