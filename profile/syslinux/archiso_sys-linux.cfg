LABEL arch
TEXT HELP
Boot the BifrOSt live/install medium on BIOS.
Based on Arch Linux for installation and system maintenance.
ENDTEXT
MENU LABEL BifrOSt live/install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.systemd.show_status=auto systemd.show_status=auto rd.udev.log_level=3 udev.log_level=3 vt.global_cursor_default=0 plymouth.ignore-serial-consoles

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot BifrOSt on BIOS with the speakup screen reader.
Provides speech feedback for installation and system maintenance.
ENDTEXT
MENU LABEL BifrOSt live/install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
